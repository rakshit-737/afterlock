# OPTIONAL: Secret metadata for the AFTERLOCK collector (--secret-metadata).
#
# WARNING: Kubernetes RBAC has no field-level "metadata only" permission.
# list/watch on secrets lets this identity read Secret BODIES with any client.
# The collector itself only requests PartialObjectMetadata (the server strips
# data before responding) and keeps namespace, name, UID and an opaque
# resourceVersion, but the grant is still general Secret read. Prefer leaving
# this unbound; the collector then records a "secret-metadata-disabled" gap
# and the analysis reports observed Secret reads with unknown versions as
# missing-metadata coverage gaps (never as "no read").
# If you must bind it, scope it to the namespaces that hold protected targets
# with RoleBindings instead of the ClusterRoleBinding below, and run the
# collector with --secret-namespaces listing those namespaces (a cluster-wide
# list is forbidden under RoleBindings; every attempt becomes a list-failed gap).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: afterlock-collector-secret-metadata
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: afterlock-collector-secret-metadata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: afterlock-collector-secret-metadata
subjects:
  - kind: ServiceAccount
    name: afterlock-collector
    namespace: afterlock
