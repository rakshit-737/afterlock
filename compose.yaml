# Application-integration profile. Requires a Docker daemon.
# The product never mounts the Docker socket and never reaches the lab cluster.
# Services: postgres (storage), migrate (one-shot schema upgrade), api, worker, web (UI).
services:
  postgres:
    # Pinned by multi-arch index digest (resolved 2026-09-26); see docs/security/supply-chain.md.
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_DB: afterlock
      POSTGRES_USER: afterlock
      POSTGRES_PASSWORD: ${AFTERLOCK_POSTGRES_PASSWORD:?set AFTERLOCK_POSTGRES_PASSWORD in .env}
    user: "999:999"  # the image's unprivileged postgres user
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp", "/var/run/postgresql"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the unix socket: during first-run init the entrypoint's temporary server
      # listens only on the socket, and a socket check would report healthy before the
      # real server (which migrate reaches over TCP) is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U afterlock -d afterlock"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Not published to the host; only the api/worker/migrate containers reach it.

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "afterlock_api.migrate"]
    environment:
      AFTERLOCK_DATABASE_URL: postgresql://afterlock:${AFTERLOCK_POSTGRES_PASSWORD}@postgres:5432/afterlock
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      AFTERLOCK_DATABASE_URL: postgresql://afterlock:${AFTERLOCK_POSTGRES_PASSWORD}@postgres:5432/afterlock
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "afterlock_worker"]
    environment:
      AFTERLOCK_DATABASE_URL: postgresql://afterlock:${AFTERLOCK_POSTGRES_PASSWORD}@postgres:5432/afterlock
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

  # Investigation UI (static files, unprivileged nginx). Proxies /v1 to the api service.
  web:
    build:
      context: services/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # nginx writes its pid to /tmp and client/proxy temp files under /var/cache/nginx.
    tmpfs: ["/tmp", "/var/cache/nginx"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
