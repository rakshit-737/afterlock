[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "afterlock"
version = "0.1.0"
description = "History-aware containment verification for Kubernetes workload identities (research-grade)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.6"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "fastapi>=0.110", "pydantic>=2.6"]

[project.scripts]
afterlock = "afterlock.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "services/api"]

[tool.setuptools.package-data]
afterlock = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_lab: requires a provisioned kind lab (never counted as passed when skipped)",
  "slow: long-running differential exploration",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B023"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection idiom
"services/api/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["afterlock", "afterlock_reference", "afterlock_api"]
known-local-folder = ["conftest", "helpers", "differential"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/afterlock", "packages/afterlock_reference"]

[[tool.mypy.overrides]]
# The reference checker deliberately uses untyped tuple encodings for states.
module = "afterlock_reference"
disallow_any_generics = false
