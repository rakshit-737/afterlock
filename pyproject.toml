[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "afterlock"
version = "0.1.0"
description = "History-aware containment verification for Kubernetes workload identities (research-grade)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn==0.30.6"]
# PostgreSQL storage backend and worker (services/api, services/worker only; never the core packages).
postgres = ["psycopg[binary]>=3.2,<4"]
# Native OIDC bearer-JWT validation in services/api (RS256/ES256 via cryptography). Never the core packages.
oidc = ["pyjwt[crypto]>=2.8,<3"]
# Documentation site only (mkdocs.yml, .github/workflows/docs.yml): static-site generator + theme.
# Pinned exactly; never imported by afterlock code and never needed at runtime.
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "pymdown-extensions==12.1"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "fastapi>=0.110", "pydantic>=2.6"]

[project.scripts]
afterlock = "afterlock.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "services/api", "services/worker"]

[tool.setuptools.package-data]
afterlock = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_lab: requires a provisioned kind lab (never counted as passed when skipped)",
  "slow: long-running differential exploration",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B023"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection idiom
"services/api/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["afterlock", "afterlock_reference", "afterlock_api", "afterlock_worker"]
known-local-folder = ["conftest", "helpers", "differential", "integration"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "packages/afterlock",
  "packages/afterlock_reference",
  "services/api/afterlock_api/storage.py",
  "services/api/afterlock_api/migrate.py",
  "services/api/afterlock_api/oidc.py",
  "services/worker/afterlock_worker",
]
mypy_path = ["packages", "services/api", "services/worker"]

[[tool.mypy.overrides]]
# The reference checker deliberately uses untyped tuple encodings for states.
module = "afterlock_reference"
disallow_any_generics = false
