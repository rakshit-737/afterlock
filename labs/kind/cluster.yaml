# Disposable AFTERLOCK lab cluster. Created only by labs/supervisor/lab.py on a
# disposable Docker-capable Linux host. Never point the supervisor at another cluster.
#
# Node image: pinned by digest, taken from the kind v0.26.0 release notes
# (https://github.com/kubernetes-sigs/kind/releases/tag/v0.26.0).
#
# CNI: kindnet (kind's default) does not enforce NetworkPolicy, so it is
# disabled and the supervisor installs Calico from a pinned, checksum-verified
# manifest (see CALICO_* in labs/supervisor/lab.py). podSubnet matches Calico's
# default IPv4 pool.
#
# Kubelet syncFrequency is lowered from the 1m default to 10s so mounted Secret
# updates (the canary rotation step) propagate sooner. The spike still measures
# and records the elapsed rotation time; this setting shortens it, it does not
# hide it, and it is lab-specific (production kubelets usually keep 1m).
#
# Audit logging: the API server logs with the collector's policy
# (services/collector/deploy/audit-policy.yaml, Metadata level, no bodies) to a
# JSON-lines file. `lab.py create` stages the policy at the fixed host path
# /tmp/afterlock-lab/policy/ before creating the cluster; the log directory is
# mounted back to /tmp/afterlock-lab/audit/ on the host, where `lab.py collect`
# hands it to the Go collector running on the host (read-only ServiceAccount
# token, never admin credentials). maxsize is large enough that the log is not
# rotated during a lab run.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: afterlock-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        syncFrequency: 10s
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/afterlock/audit-policy.yaml
            audit-log-path: /var/log/kubernetes/audit/audit.log
            audit-log-format: json
            audit-log-maxsize: "500"
            audit-log-maxbackup: "1"
          extraVolumes:
            - name: afterlock-audit-policy
              hostPath: /etc/kubernetes/afterlock
              mountPath: /etc/kubernetes/afterlock
              readOnly: true
              pathType: DirectoryOrCreate
            - name: afterlock-audit-log
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: /tmp/afterlock-lab/policy
        containerPath: /etc/kubernetes/afterlock
        readOnly: true
      - hostPath: /tmp/afterlock-lab/audit
        containerPath: /var/log/kubernetes/audit
networking:
  apiServerAddress: "127.0.0.1"
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
