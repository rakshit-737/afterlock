name: portable-checks

on:
  push:
    branches: [main]
  pull_request:

# Untrusted pull requests get read-only permissions and no secrets.
permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          activate-environment: true
      - name: Install (from uv.lock, frozen)
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra postgres --extra oidc
      - name: Doctor (replay profile)
        run: python scripts/doctor --profile replay
      - name: Lint
        run: ruff check packages services tests datasets benchmarks
      - name: Type check
        run: mypy
      - name: Tests (live-lab tests report as skipped = BLOCKED, never as passed)
        env:
          AFTERLOCK_DIFFERENTIAL_EXAMPLES: "300"
        run: pytest -q -rs
      - name: Replay bundles reproducible from generator
        run: |
          python datasets/generators/build_semantic_cases.py
          git diff --exit-code -- datasets/replay
      - name: Benchmark regenerates
        run: python benchmarks/run.py --repeat 2

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - name: Install (from uv.lock, frozen)
        run: uv sync --frozen --extra dev
      - name: Generate CycloneDX SBOMs
        run: sh scripts/sbom
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: error
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Lint (security policy)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # End-to-end: Playwright starts the real API (in-memory storage, throwaway token) and
      # `vite preview`, then drives Chromium. See services/web/playwright.config.ts.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          activate-environment: true
      - name: Install API and uvicorn (from uv.lock, frozen)
        working-directory: .
        run: uv sync --frozen --extra dev --extra api
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright + axe)
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: services/web/playwright-report
          retention-days: 7
  postgres:
    # Storage/worker contract tests against a real PostgreSQL. Throwaway credentials, no secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afterlock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afterlock_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AFTERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afterlock_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          activate-environment: true
      - name: Install (from uv.lock, frozen)
        run: uv sync --frozen --extra dev --extra postgres
      - name: Migrations apply to an empty database
        env:
          AFTERLOCK_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afterlock_test
        run: python -m afterlock_api.migrate && python -m afterlock_api.migrate --status
      - name: Storage, worker, and migration tests (a skip here is a failure)
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/unit/test_migrate.py tests/integration/test_storage_contract.py tests/integration/test_api_jobs.py | tee pg.log
          ! grep -q "BLOCKED: no PostgreSQL" pg.log
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/collector/go.mod
          cache-dependency-path: services/collector/go.sum
      - name: Verify module
        env:
          GOTOOLCHAIN: local
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...
      - name: Test (includes byte-for-byte golden bundle check)
        env:
          GOTOOLCHAIN: local
        run: go test -race -count=1 ./...
      - name: Build
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/afterlock-collector ./cmd/afterlock-collector
  containers:
    # Build every product image and smoke-test the compose stack end to end.
    # Throwaway credentials generated in the job; .env is never committed or uploaded.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker versions
        run: docker version && docker compose version
      - name: Generate throwaway .env
        run: |
          umask 077
          token=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))")
          password=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))")
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          printf 'AFTERLOCK_API_TOKENS=%s:analyst:lab-local\nAFTERLOCK_POSTGRES_PASSWORD=%s\n' "$token" "$password" > .env
          echo "AFTERLOCK_SMOKE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Build api/worker/migrate and web images
        run: docker compose build
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - name: API image packages match uv.lock
        # Expected set: the same export the Dockerfile uses, installed into a scratch Linux
        # 3.11 venv so environment markers resolve as they do in the image.
        run: |
          set -euo pipefail
          lockcheck="$RUNNER_TEMP/lockcheck"
          uv export --frozen --no-dev --extra api --extra postgres --no-emit-project \
            --format requirements-txt --output-file "$lockcheck.txt"
          uv venv -q -p 3.11 "$lockcheck"
          uv pip sync -q --python "$lockcheck/bin/python" --require-hashes "$lockcheck.txt"
          norm() { tr 'A-Z_' 'a-z-' | sort; }
          uv pip freeze --python "$lockcheck/bin/python" | norm > "$lockcheck.expected"
          # Packages the digest-pinned base image already ships (pip tooling and its deps, e.g.
          # packaging) are not ours to lock; subtract exactly those lines. A lock package that the
          # image carries at a different version than the base still shows up in the diff.
          base=$(sed -n 's/^FROM \(python:[^ ]*\) AS build$/\1/p' services/api/Dockerfile)
          docker run --rm --entrypoint python "$base" -m pip freeze | norm > "$lockcheck.base"
          docker compose run --rm --no-deps --entrypoint python api -m pip freeze > "$lockcheck.raw"
          grep -Ev '^afterlock( |==|@)' "$lockcheck.raw" | norm | comm -23 - "$lockcheck.base" > "$lockcheck.actual"
          grep -q . "$lockcheck.expected"
          diff -u "$lockcheck.expected" "$lockcheck.actual"
          grep -Eq '^afterlock( |==|@)' "$lockcheck.raw"
      - name: Build collector image
        run: docker build -t afterlock-collector:ci services/collector
      - name: Collector image runs as non-root
        run: |
          user=$(docker image inspect afterlock-collector:ci --format '{{.Config.User}}')
          echo "collector user: $user"
          test "$user" = "65532:65532"
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300 postgres api worker web
      - name: Smoke test
        run: python3 scripts/compose-smoke
      - name: Compose state and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
      - name: Tear down
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          rm -f .env
