name: portable-checks

on:
  push:
    branches: [main]
  pull_request:

# Untrusted pull requests get read-only permissions and no secrets.
permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          activate-environment: true
      - name: Install (from uv.lock, frozen)
        run: |
          uv lock --check
          uv sync --frozen --extra dev
      - name: Doctor (replay profile)
        run: python scripts/doctor --profile replay
      - name: Lint
        run: ruff check packages services tests datasets benchmarks
      - name: Type check
        run: mypy
      - name: Tests (live-lab tests report as skipped = BLOCKED, never as passed)
        env:
          AFTERLOCK_DIFFERENTIAL_EXAMPLES: "300"
        run: pytest -q -rs
      - name: Replay bundles reproducible from generator
        run: |
          python datasets/generators/build_semantic_cases.py
          git diff --exit-code -- datasets/replay
      - name: Benchmark regenerates
        run: python benchmarks/run.py --repeat 2

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - name: Install (from uv.lock, frozen)
        run: uv sync --frozen --extra dev
      - name: Generate CycloneDX SBOMs
        run: sh scripts/sbom
      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: error
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Lint (security policy)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
