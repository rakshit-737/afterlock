name: portable-checks

on:
  push:
    branches: [main]
  pull_request:

# Untrusted pull requests get read-only permissions and no secrets.
permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          activate-environment: true
      - name: Install (from uv.lock, frozen)
        run: |
          uv lock --check
          uv sync --frozen --extra dev
      - name: Doctor (replay profile)
        run: python scripts/doctor --profile replay
      - name: Lint
        run: ruff check packages services tests datasets benchmarks
      - name: Type check
        run: mypy
      - name: Tests (live-lab tests report as skipped = BLOCKED, never as passed)
        env:
          AFTERLOCK_DIFFERENTIAL_EXAMPLES: "300"
        run: pytest -q -rs
      - name: Replay bundles reproducible from generator
        run: |
          python datasets/generators/build_semantic_cases.py
          git diff --exit-code -- datasets/replay
      - name: Benchmark regenerates
        run: python benchmarks/run.py --repeat 2

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - name: Install (from uv.lock, frozen)
        run: uv sync --frozen --extra dev
      - name: Generate CycloneDX SBOMs
        run: sh scripts/sbom
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: error
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Lint (security policy)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
