name: live-lab

# Privileged lab execution: manual dispatch only by maintainers, never on
# pull_request, never with repository secrets. Runs on a disposable
# GitHub-hosted runner that is discarded after the job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          activate-environment: true
      # Tag v5.6.0 -> commit 40f1582b..., checked with
      # `gh api repos/actions/setup-go/git/ref/tags/v5.6.0` (object type: commit); same pin as ci.yml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/collector/go.mod
          cache-dependency-path: services/collector/go.sum
      - name: Install AFTERLOCK (from uv.lock, frozen)
        run: uv sync --frozen --extra dev
      - name: Install kind and kubectl (pinned versions, checksum-verified)
        env:
          KIND_VERSION: v0.26.0
          KUBECTL_VERSION: v1.31.4
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod +x kind kubectl && sudo mv kind kubectl /usr/local/bin/
      - name: Doctor (live-lab profile)
        run: python scripts/doctor --profile live-lab
      - name: Create lab
        run: scripts/lab create
      - name: Semantic spike (reset + spike, 3 runs)
        run: AFTERLOCK_LIVE_LAB=1 AFTERLOCK_LAB_REPEAT=3 python -m pytest -q tests/conformance -rs
      - name: Build collector (verified modules, local toolchain)
        working-directory: services/collector
        env:
          GOTOOLCHAIN: local
        run: |
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/afterlock-collector" ./cmd/afterlock-collector
      # Two collection windows (residual-token checkpoint, then post-containment compared
      # with targeted-containment) plus the S-SEC-5 propagation steps; the test asserts
      # every check is present and the receipt is lab_confirmed.
      - name: Collector run against the lab (reset + spike + collect, both windows)
        env:
          AFTERLOCK_COLLECTOR_BIN: ${{ runner.temp }}/afterlock-collector
          AFTERLOCK_LIVE_COLLECT: "1"
        run: python -m pytest -q tests/conformance -rs -k test_collect_both_windows
      # Reached only when `collect` succeeded, which requires a clean leak scan: the
      # supervisor keeps a bundle under labs/collected/ only after the scan passes.
      - name: Upload collected bundle (leak scan passed)
        if: success() && hashFiles('labs/collected/**/manifest.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collected-bundle
          path: labs/collected/
          if-no-files-found: error
      - name: Derive lab labels from receipts
        if: always()
        run: python benchmarks/lab_labels.py
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-receipts
          path: |
            labs/receipts/
            benchmarks/labels/lab-derived.json
      - name: Destroy lab
        if: always()
        run: scripts/lab destroy || true
