name: live-lab

# Privileged lab execution: manual dispatch only by maintainers, never on
# pull_request, never with repository secrets. Runs on a disposable
# GitHub-hosted runner that is discarded after the job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          activate-environment: true
      - name: Install AFTERLOCK (from uv.lock, frozen)
        run: uv sync --frozen --extra dev
      - name: Install kind and kubectl (pinned versions, checksum-verified)
        env:
          KIND_VERSION: v0.26.0
          KUBECTL_VERSION: v1.31.4
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod +x kind kubectl && sudo mv kind kubectl /usr/local/bin/
      - name: Doctor (live-lab profile)
        run: python scripts/doctor --profile live-lab
      - name: Create lab
        run: scripts/lab create
      - name: Semantic spike
        run: AFTERLOCK_LIVE_LAB=1 python -m pytest -q tests/conformance -rs
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-receipts
          path: labs/receipts/
      - name: Destroy lab
        if: always()
        run: scripts/lab destroy || true
